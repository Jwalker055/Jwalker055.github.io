<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotChecker — Search results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="SpotChecker logo">
        SpotChecker
      </a>
      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Find parking</a></li>
          <li><a href="list.html">Lots</a></li>
          <li><a href="report.html">Report</a></li>
          <li><a href="detail.html">Favorites</a></li>
        </ul>
      </nav>
      <form class="header-search" action="search.html" method="get" role="search">
        <label class="sr-only" for="site-search">Search SpotChecker</label>
        <input type="text" id="site-search" name="q" placeholder='Try "parking pass"'>
        <button type="submit" class="btn">Search</button>
      </form>
      <span class="account-dot" role="img" aria-label="Your account">JW</span>
    </div>
  </header>

  <main class="container">
    <h1>Search results</h1>
    <!-- JavaScript fills in the search term and the results below -->
    <p>You searched for: <span id="search-query">(nothing)</span></p>

    <!-- script.js appends either simulated result cards or a
         friendly "no results" message into this container. -->
    <div id="search-results"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 SpotChecker · A Virginia Tech student project</span>
      <ul>
        <li><a href="index.html">About</a></li>
        <li><a href="index.html">How it works</a></li>
        <li><a href="index.html">Help</a></li>
        <li><a href="index.html">Contact</a></li>
      </ul>
    </div>
  </footer>

  <!-- jQuery (local copy) loaded first, then our own script -->
  <script src="js/jquery.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
