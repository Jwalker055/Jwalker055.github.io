<!-- Image source: original schematic map illustration created by Jasmine Walker for SpotChecker (Project 2). Not copied from any external site. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Schematic campus map with parking lot markers">
  <rect width="640" height="400" fill="#eceaf3"/>
  <!-- roads -->
  <rect x="0" y="170" width="640" height="26" fill="#d7d3e4"/>
  <rect x="300" y="0" width="26" height="400" fill="#d7d3e4"/>
  <rect x="90" y="0" width="14" height="400" fill="#e2dfee"/>
  <rect x="0" y="300" width="640" height="14" fill="#e2dfee"/>
  <!-- building blocks -->
  <rect x="360" y="60" width="120" height="80" rx="6" fill="#cfc8e0"/>
  <rect x="150" y="220" width="110" height="70" rx="6" fill="#cfc8e0"/>
  <rect x="420" y="230" width="140" height="90" rx="6" fill="#cfc8e0"/>
  <!-- parking markers -->
  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="150" cy="120" r="17" fill="#2e7d51"/><text x="150" y="125">P</text>
    <circle cx="430" cy="180" r="17" fill="#b26a00"/><text x="430" y="185">P</text>
    <circle cx="250" cy="330" r="17" fill="#a3302b"/><text x="250" y="335">P</text>
    <circle cx="540" cy="110" r="17" fill="#2e7d51"/><text x="540" y="115">P</text>
  </g>
</svg>
